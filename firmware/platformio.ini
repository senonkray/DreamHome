[platformio]
src_dir = LumaHome
data_dir = LumaHome/data

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200

board_build.f_cpu = 160000000L
lib_deps = bblanchon/ArduinoJson@6.21.5

[env:d1_mini]
extends = env:nodemcuv2
board = d1_mini

; Wi-Fi update of a board that already runs this firmware:
;   LUMA_OTA_KEY='API_KEY из config.h' pio run -e d1_mini_ota -t upload
;   LUMA_OTA_KEY='API_KEY из config.h' pio run -e d1_mini_ota -t uploadfs
; If luma.local does not resolve, replace upload_port with the board IP.
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = luma.local
upload_flags = --auth=${sysenv.LUMA_OTA_KEY}
