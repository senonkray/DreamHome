[platformio]
src_dir = LumaHome
data_dir = LumaHome/data

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200

board_build.f_cpu = 160000000L
lib_deps = bblanchon/ArduinoJson@6.21.5

[env:d1_mini]
extends = env:nodemcuv2
board = d1_mini
